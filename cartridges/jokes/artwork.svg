<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- Joke Factory artwork for the iOS app (the e-paper icon is icon.png): a glowing speech
     bubble laughing "HA HA" under the app icon's night sky, with fireflies. -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0B1426"/><stop offset="0.6" stop-color="#0E1F22"/><stop offset="1" stop-color="#12291B"/>
  </linearGradient>
  <radialGradient id="halo" r="0.5">
    <stop offset="0" stop-color="#F3F27A" stop-opacity="0.7"/><stop offset="0.35" stop-color="#B8E04E" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#7BC043" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bubble" x1="0" y1="240" x2="0" y2="760" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFDE6"/><stop offset="0.55" stop-color="#F1F27C"/><stop offset="1" stop-color="#C9D44A"/>
  </linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<g fill="#F4EBD0">
  <circle cx="150" cy="170" r="5" opacity="0.9"/><circle cx="290" cy="100" r="3" opacity="0.6"/>
  <circle cx="860" cy="130" r="4" opacity="0.8"/><circle cx="930" cy="360" r="3" opacity="0.5"/>
  <circle cx="90" cy="460" r="3" opacity="0.5"/><circle cx="600" cy="80" r="2.5" opacity="0.5"/>
  <circle cx="940" cy="640" r="4" opacity="0.7"/><circle cx="110" cy="760" r="2.5" opacity="0.4"/>
  <circle cx="230" cy="930" r="3" opacity="0.5"/><circle cx="860" cy="900" r="3.5" opacity="0.6"/>
</g>
<circle cx="512" cy="500" r="420" fill="url(#halo)"/>
<!-- the bubble -->
<path d="M250 260 h524 a90 90 0 0 1 90 90 v250 a90 90 0 0 1 -90 90 h-300 l-150 130 l30 -130 h-104 a90 90 0 0 1 -90 -90 v-250 a90 90 0 0 1 90 -90 z"
      fill="url(#bubble)"/>
<text x="512" y="530" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900"
      font-size="148" fill="#1A2410" letter-spacing="4">HA HA</text>
<!-- fireflies -->
<circle cx="230" cy="300" r="70" fill="url(#halo)"/><circle cx="230" cy="300" r="7" fill="#FFFBD2"/>
<circle cx="840" cy="760" r="60" fill="url(#halo)"/><circle cx="840" cy="760" r="6" fill="#FFFBD2"/>
<circle cx="760" cy="200" r="54" fill="url(#halo)"/><circle cx="760" cy="200" r="5" fill="#FFFBD2"/>
</svg>
