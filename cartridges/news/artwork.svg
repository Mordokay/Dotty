<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- News artwork for the iOS app (the e-paper icon is icon.png): a glowing newspaper with a
     headline, a picture and columns of text under the app icon's night sky, with fireflies. -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0B1426"/><stop offset="0.6" stop-color="#0E1F22"/><stop offset="1" stop-color="#12291B"/>
  </linearGradient>
  <radialGradient id="halo" r="0.5">
    <stop offset="0" stop-color="#F3F27A" stop-opacity="0.6"/><stop offset="0.35" stop-color="#B8E04E" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#7BC043" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="paper" x1="0" y1="220" x2="0" y2="820" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFDE6"/><stop offset="0.55" stop-color="#F1F27C"/><stop offset="1" stop-color="#C9D44A"/>
  </linearGradient>
  <radialGradient id="fly" r="0.5">
    <stop offset="0" stop-color="#FFFBD0"/><stop offset="0.25" stop-color="#F3F27A" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#B8E04E" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1024" height="1024" fill="url(#sky)"/>
<g fill="#F4EBD0">
  <circle cx="150" cy="170" r="5" opacity="0.9"/><circle cx="290" cy="100" r="3" opacity="0.6"/>
  <circle cx="860" cy="130" r="4" opacity="0.8"/><circle cx="930" cy="360" r="3" opacity="0.5"/>
  <circle cx="90" cy="460" r="3" opacity="0.5"/><circle cx="600" cy="80" r="2.5" opacity="0.5"/>
  <circle cx="940" cy="640" r="4" opacity="0.7"/><circle cx="110" cy="760" r="2.5" opacity="0.4"/>
  <circle cx="230" cy="930" r="3" opacity="0.5"/><circle cx="860" cy="900" r="3.5" opacity="0.6"/>
</g>
<circle cx="512" cy="520" r="430" fill="url(#halo)"/>
<g transform="rotate(-6 512 520)">
  <rect x="210" y="250" width="604" height="540" rx="44" fill="url(#paper)"/>
  <rect x="270" y="310" width="484" height="74" rx="14" fill="#1C2A12"/>
  <rect x="270" y="420" width="210" height="160" rx="16" fill="#1C2A12" opacity="0.85"/>
  <g fill="#1C2A12" opacity="0.75">
    <rect x="512" y="424" width="242" height="22" rx="11"/><rect x="512" y="476" width="242" height="22" rx="11"/>
    <rect x="512" y="528" width="200" height="22" rx="11"/><rect x="270" y="618" width="484" height="22" rx="11"/>
    <rect x="270" y="670" width="484" height="22" rx="11"/><rect x="270" y="722" width="330" height="22" rx="11"/>
  </g>
</g>
<circle cx="230" cy="250" r="60" fill="url(#fly)"/><circle cx="232" cy="250" r="9" fill="#FFFBD0"/>
<circle cx="840" cy="200" r="46" fill="url(#fly)"/><circle cx="840" cy="200" r="7" fill="#FFFBD0"/>
<circle cx="830" cy="780" r="52" fill="url(#fly)"/><circle cx="830" cy="780" r="8" fill="#FFFBD0"/>
</svg>
