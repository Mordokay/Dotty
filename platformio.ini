; Dotty — Waveshare ESP32-S3-Touch-ePaper-1.54 (V2, ESP32-S3-PICO-1-N8R8)
;
; Each line below replaces an option from the Arduino IDE "Tools" menu.
; Build / Upload / Monitor: pioarduino sidebar or status-bar buttons in VS Code,
; or `pio run`, `pio run -t upload`, `pio device monitor` in a terminal.

[env:dotty]
; pioarduino platform = Arduino-ESP32 core 3.x (Waveshare requires >= 3.3.0)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

; Tools > Board: "ESP32S3 Dev Module"
board = esp32-s3-devkitc-1
; Tools > Flash Size: "8MB (64Mb)"  /  Flash Mode: "QIO 80MHz"
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
; Tools > PSRAM: "OPI PSRAM"
board_build.arduino.memory_type = qio_opi
; Tools > Partition Scheme: custom, two OTA app slots for BLE firmware updates
board_build.partitions = partitions.csv
; Tools > CPU Frequency: "240MHz (WiFi)"
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    ; Tools > USB Mode: "Hardware CDC and JTAG"
    -DARDUINO_USB_MODE=1
    ; Tools > USB CDC On Boot: "Enabled" (Serial -> USB-C port)
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Tools > Core Debug Level: 0 None ... 5 Verbose
    -DCORE_DEBUG_LEVEL=3

; Tools > Upload Speed
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
