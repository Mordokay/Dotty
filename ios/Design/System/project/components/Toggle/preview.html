<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toggle — preview</title></head>
<body>
<div class="lp-stage"><div id="root" class="lp-demo-col"></div></div>
<script>
  var L = window.Dotty, h = React.createElement;
  function Demo() {
    var a = React.useState(true), b = React.useState(false), c = React.useState(true);
    return h(React.Fragment, null,
      h(L.Toggle, { label: 'Notifications on bracelet', showLabel: true, checked: a[0], onChange: a[1] }),
      h(L.Toggle, { label: 'Light while disconnected', showLabel: true, checked: b[0], onChange: b[1] }),
      h(L.Toggle, { label: 'Glow in partner colour', showLabel: true, light: 'bloom', checked: c[0], onChange: c[1] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
