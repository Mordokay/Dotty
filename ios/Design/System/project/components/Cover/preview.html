<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dotty — cover</title>
<style>
  body { margin: 0; background: var(--void); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--void); }
  .cover svg { position: absolute; inset: 0; }
  .light { mix-blend-mode: screen; }
  .lagoon { fill: var(--light-lagoon); }
  .bloom { fill: var(--light-bloom); }
  .firefly { fill: var(--light-firefly); }
  .dusk { fill: var(--light-dusk); }
  .mote { fill: var(--ink); }
  .text { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 120px; line-height: 0.92; color: var(--ink); }
  .tagline { margin-top: 16px; font-family: var(--font-text); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: light-lagoon (disc r 120), light-bloom (disc r 104), light-dusk (disc r 72), light-firefly (disc r 48)
      arrangement: overlapping discs right of x = 480, two bleeding off the top and bottom edges, blended with screen so overlaps mix like light
      pattern: discs, because the system is made of lights and rounded shapes: small motes in ink, r 2 to 4
      scales: offsets from space-xl (24) and space-2xl (32); everything a circle, the radius-pill shape
    -->
    <circle class="light lagoon" cx="640" cy="96" r="120"/>
    <circle class="light bloom" cx="792" cy="206" r="104"/>
    <circle class="light dusk" cx="904" cy="56" r="72"/>
    <circle class="light firefly" cx="704" cy="232" r="48"/>
    <circle class="mote" cx="512" cy="40" r="3"/>
    <circle class="mote" cx="560" cy="248" r="2"/>
    <circle class="mote" cx="936" cy="168" r="3"/>
    <circle class="mote" cx="856" cy="24" r="2"/>
    <circle class="mote" cx="528" cy="152" r="2"/>
    <circle class="mote" cx="944" cy="264" r="4"/>
  </svg>
  <div class="text">
    <div class="name">Dotty</div>
    <div class="tagline">Light, colour and touch for Dotty.</div>
  </div>
</div>
</body>
</html>
