<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusPill — preview</title></head>
<body>
<div class="lp-stage"><div id="root" class="lp-demo"></div></div>
<script>
  var L = window.Dotty, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(L.StatusPill, { state: 'connected' }),
    h(L.StatusPill, { state: 'connected', light: 'bloom' }, 'Mia is online'),
    h(L.StatusPill, { state: 'searching' }),
    h(L.StatusPill, { state: 'connecting' }),
    h(L.StatusPill, { state: 'off' }),
    h(L.StatusPill, { state: 'error' })));
</script>
</body>
</html>
