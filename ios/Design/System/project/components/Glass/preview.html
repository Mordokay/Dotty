<!doctype html>
<html>
<head><meta charset="utf-8"><title>Glass — preview</title></head>
<body>
<div class="lp-stage"><div id="root" class="lp-demo-col" style="max-width:none"></div></div>
<script>
  var L = window.Dotty, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 24, width: '100%', alignItems: 'start' } },
    h(L.Glass, { title: 'Your bracelet', light: 'firefly' },
      h(L.ListRow, { light: 'firefly', title: 'Dotty', subtitle: 'Music cartridge 0.4.0', trailing: h(L.StatusPill, { state: 'connected' }) })),
    h(L.Glass, { title: 'Saved patterns' },
      h(L.ListRow, { title: 'Heartbeat', subtitle: '4 touches · 2.1 s', onClick: function () {} }),
      h(L.ListRow, { title: 'Good night', subtitle: '2 touches · 1.4 s', onClick: function () {} }))));
</script>
</body>
</html>
