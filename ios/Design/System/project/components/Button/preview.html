<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="lp-stage"><div id="root" class="lp-demo"></div></div>
<script>
  var L = window.Dotty, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(L.Button, { variant: 'light', icon: 'ripple' }, 'Send touch'),
    h(L.Button, { variant: 'light', light: 'bloom' }, 'Reply'),
    h(L.Button, null, 'Choose colour'),
    h(L.Button, { variant: 'quiet' }, 'Not now'),
    h(L.Button, { disabled: true }, 'Sending…')));
</script>
</body>
</html>
