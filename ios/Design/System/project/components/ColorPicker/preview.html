<!doctype html>
<html>
<head><meta charset="utf-8"><title>ColorPicker — preview</title></head>
<body>
<div class="lp-stage"><div id="root" class="lp-demo"></div></div>
<script>
  var L = window.Dotty, h = React.createElement;
  function Demo() {
    var c = React.useState('lagoon');
    return h(L.ColorPicker, { label: 'Bracelet colour', value: c[0], onChange: c[1] });
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
